name: Load Datas

on:
  workflow_dispatch:

jobs:
  create-indexes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Azure Login
        uses: Azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync
        working-directory: utility/indexer

      - name: Resolve Azure Search settings
        env:
          RESOURCE_GROUP_NAME: ${{ secrets.RESOURCE_GROUP_NAME }}
          SEARCH_API_VERSION: ${{ secrets.SEARCH_API_VERSION }}
        run: |
          SEARCH_SERVICE_NAME=$(az resource list \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --query "[?type=='Microsoft.Search/searchServices'].name | [0]" \
            --output tsv)

          if [ -z "$SEARCH_SERVICE_NAME" ]; then
            echo "No Azure AI Search service found in resource group $RESOURCE_GROUP_NAME" >&2
            exit 1
          fi

          SEARCH_ENDPOINT="https://$(az search service show \
            --name "$SEARCH_SERVICE_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --query hostName \
            --output tsv)"
          SEARCH_API_KEY=$(az search admin-key show \
            --service-name "$SEARCH_SERVICE_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --query primaryKey \
            --output tsv)

          {
            echo "SEARCH_ENDPOINT=$SEARCH_ENDPOINT"
            echo "SEARCH_API_KEY=$SEARCH_API_KEY"
            echo "SEARCH_API_VERSION=${SEARCH_API_VERSION:-2025-09-01}"
          } >> "$GITHUB_ENV"

      - name: Run index creation script
        run: |
          uv run python main.py
        working-directory: utility/indexer

  load_indexes:
    needs: create-indexes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Azure Login
        uses: Azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync
        working-directory: utility/loader

      - name: Resolve Azure Search settings
        env:
          RESOURCE_GROUP_NAME: ${{ secrets.RESOURCE_GROUP_NAME }}
          SEARCH_API_VERSION: ${{ secrets.SEARCH_API_VERSION }}
        run: |
          SEARCH_SERVICE_NAME=$(az resource list \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --query "[?type=='Microsoft.Search/searchServices'].name | [0]" \
            --output tsv)

          if [ -z "$SEARCH_SERVICE_NAME" ]; then
            echo "No Azure AI Search service found in resource group $RESOURCE_GROUP_NAME" >&2
            exit 1
          fi

          SEARCH_ENDPOINT="https://$(az search service show \
            --name "$SEARCH_SERVICE_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --query hostName \
            --output tsv)"
          SEARCH_API_KEY=$(az search admin-key show \
            --service-name "$SEARCH_SERVICE_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --query primaryKey \
            --output tsv)

          {
            echo "SEARCH_ENDPOINT=$SEARCH_ENDPOINT"
            echo "SEARCH_API_KEY=$SEARCH_API_KEY"
            echo "SEARCH_API_VERSION=${SEARCH_API_VERSION:-2025-09-01}"
          } >> "$GITHUB_ENV"

      - name: Resolve Azure OpenAI settings
        env:
          RESOURCE_GROUP_NAME: ${{ secrets.RESOURCE_GROUP_NAME }}
          FOUNDRY_RESOURCE_NAME: ${{ secrets.FOUNDRY_RESOURCE_NAME }}
          EMBEDDING_OPENAI_DEPLOYMENT: ${{ secrets.EMBEDDING_OPENAI_DEPLOYMENT }}
          OPENAI_API_VERSION: ${{ secrets.OPENAI_API_VERSION }}
        run: |
          OPENAI_ENDPOINT=$(az cognitiveservices account show \
            --name "$FOUNDRY_RESOURCE_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --query properties.endpoint \
            --output tsv)
          OPENAI_KEY=$(az cognitiveservices account keys list \
            --name "$FOUNDRY_RESOURCE_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --query key1 \
            --output tsv)

          {
            echo "OPENAI_ENDPOINT=$OPENAI_ENDPOINT"
            echo "OPENAI_KEY=$OPENAI_KEY"
            echo "EMBEDDING_OPENAI_DEPLOYMENT=$EMBEDDING_OPENAI_DEPLOYMENT"
            echo "OPENAI_API_VERSION=${OPENAI_API_VERSION:-2024-02-01}"
          } >> "$GITHUB_ENV"

      - name: Run index creation script
        run: |
          uv run python main.py
        working-directory: utility/loader

  load_crime_database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Azure Login
        uses: Azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync
        working-directory: utility/database

      - name: Resolve Cosmos DB connection string
        env:
          RESOURCE_GROUP_NAME: ${{ secrets.RESOURCE_GROUP_NAME }}
          COSMOSDB_ACCOUNT_NAME: ${{ secrets.COSMOSDB_ACCOUNT_NAME }}
        run: |
          COSMOS_DB_CNX_STRING=$(az cosmosdb keys list \
            --name "$COSMOSDB_ACCOUNT_NAME" \
            --resource-group "$RESOURCE_GROUP_NAME" \
            --type connection-strings \
            --query "connectionStrings[0].connectionString" \
            --output tsv)

          echo "COSMOS_DB_CNX_STRING=$COSMOS_DB_CNX_STRING" >> "$GITHUB_ENV"

      - name: Run index creation script
        env:
          DATABASE_ID: "skyrim"
          CONTAINER_ID: "crime"
          PARTITION_KEY: "crimeType"
        run: |
          uv run python main.py
        working-directory: utility/database
